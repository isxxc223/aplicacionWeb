<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño Responsivo</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h2>Header</h2>
    </header>

    <!-- Sección Superior: 2 bloques -->
    <section class="seccion-doble">
        <div class="bloque">Bloque 1</div>
        <div class="bloque">Bloque 2</div>
    </section>

    <!-- Sección Intermedia: 3 cajas -->
    <section class="seccion-tres">
        <div class="caja-roja">Caja 1</div>
        <div class="caja-roja">Caja 2</div>
        <div class="caja-roja">Caja 3</div>
    </section>

    <!-- Sección Inferior: 4 cajas -->
    <section class="seccion-cuatro">
        <div class="caja-roja">Caja A</div>
        <div class="caja-roja">Caja B</div>
        <div class="caja-roja">Caja C</div>
        <div class="caja-roja">Caja D</div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <h2>Footer</h2>
    </footer>

</body>
</html>
